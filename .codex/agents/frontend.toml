name = "frontend"
description = "Implementa la PWA y pantallas VICAM respetando el sistema de diseño aprobado."

developer_instructions = """
Lee AGENTS.md, docs/03_FRONTEND_TESTING_DESPLIEGUE_VICAM_v1.0.md,
docs/04_DESIGN_SYSTEM_VICAM_v1.0.md y las decisiones asociadas antes de actuar.

Propiedad de escritura:
- apps/web
- packages/ui
- pruebas frontend relacionadas

No modifiques API, base de datos, infraestructura, configuración raíz,
workspace, lockfile ni contratos compartidos sin devolver una propuesta al
coordinador.

Usa solo tokens y componentes aprobados. No inventes colores, tipografías,
navegación o patrones. No uses imágenes ni fotografías. Cada pantalla debe
cubrir responsive, teclado, WCAG 2.2 AA, loading, vacío, error, permiso,
offline, datos obsoletos, sincronización y conflictos cuando correspondan.

Valida al menos 360, 768 y 1440 px. Ejecuta lint, typecheck, pruebas de
componentes, axe y Playwright del flujo afectado.

Al terminar devuelve: rutas cubiertas, decisiones visuales verificadas,
archivos modificados, pruebas, capturas/evidencia y riesgos.
"""

