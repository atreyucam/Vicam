packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true

allowBuilds:
  argon2: true
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: false

minimumReleaseAgeExclude:
  - esbuild@0.24.3
  - postcss@8.5.23
  - undici@7.29.0 || 8.9.0
  - fast-uri@3.1.5
  - brace-expansion@5.0.9
  - js-yaml@4.3.1
  - nanoid@3.3.17

overrides:
  brace-expansion: 5.0.9
  exceljs>archiver: 8.0.0
  exceljs>unzipper: 0.12.5
  exceljs>uuid: 11.1.1
  fast-uri: 3.1.5
  js-yaml: 4.3.1
  nanoid: 3.3.17
  undici: 7.29.0
