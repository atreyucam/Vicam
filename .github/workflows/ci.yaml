name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm 11.9.0
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Generate and validate OpenAPI client
        run: |
          pnpm --filter @vicam/contracts generate
          git diff --exit-code -- packages/contracts/openapi.json packages/contracts/src/generated/schema.ts

      - name: Test
        run: pnpm test

      - name: PostgreSQL 18 migration integration
        run: pnpm --filter @vicam/db test:integration

      - name: Phase 1 through 4 API/DB integration
        run: >-
          pnpm --filter @vicam/db exec cross-env VICAM_RUN_DB_INTEGRATION=1
          pnpm --filter @vicam/api exec vitest run --testTimeout=15000 --maxWorkers=1
          src/phase1.integration.test.ts src/phase2.integration.test.ts
          src/phase3.integration.test.ts src/phase4.integration.test.ts

      - name: Phase 3 worker jobs
        run: pnpm --filter @vicam/worker exec vitest run src/phase3.test.ts

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @vicam/web exec playwright install --with-deps chromium

      - name: Phase 1 through 4 responsive, PWA and accessibility E2E
        run: pnpm --filter @vicam/web exec playwright test

      - name: Online-only rollback E2E
        run: >-
          pnpm --filter @vicam/web exec playwright test
          --config=playwright.rollback.config.ts

      - name: Dependency audit
        run: pnpm audit --audit-level high

      - name: Validate Compose examples
        run: |
          docker compose --env-file infra/env/local.env.example -f compose.yaml config --quiet
          docker compose --env-file infra/env/staging.env.example -f compose.staging.yaml config --quiet
          docker compose --env-file infra/env/production.env.example -f compose.production.yaml config --quiet
          docker compose --env-file infra/env/staging.env.example -f compose.staging.yaml -f compose.vps.yaml config --quiet
          docker compose --env-file infra/env/production.env.example -f compose.production.yaml -f compose.vps.yaml config --quiet

      - name: Validate Caddy configurations
        run: |
          docker run --rm \
            -e VICAM_SITE_ADDRESS=staging.app.vicamproduce.com \
            -e CADDY_EMAIL=ops@example.invalid \
            -e "VICAM_CSP_MAP_CONNECT_SRC=https://api.maptiler.com https://*.maptiler.com" \
            -e "VICAM_CSP_MAP_IMG_SRC=https://api.maptiler.com https://*.maptiler.com" \
            -v "$PWD/infra/caddy/Caddyfile.tls:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -e "VICAM_CSP_MAP_CONNECT_SRC=https://api.maptiler.com https://*.maptiler.com" \
            -e "VICAM_CSP_MAP_IMG_SRC=https://api.maptiler.com https://*.maptiler.com" \
            -v "$PWD/infra/caddy/Caddyfile.vps:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -e "VICAM_CSP_MAP_CONNECT_SRC=https://api.maptiler.com https://*.maptiler.com" \
            -e "VICAM_CSP_MAP_IMG_SRC=https://api.maptiler.com https://*.maptiler.com" \
            -v "$PWD/infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648 \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validate Phase 4 operational scripts
        run: |
          node --check infra/scripts/smoke.mjs
          node --check infra/scripts/monitor.mjs
          node --check infra/scripts/document-antivirus-smoke.mjs
          sh -n infra/scripts/backup-restore-test.sh
          sh -n infra/scripts/clamav-smoke.sh
          sh -n infra/scripts/release-state.sh
          docker run --rm \
            -v "$PWD:/work:ro" -w /work \
            grafana/k6@sha256:a33a0cfdc4d2483d6b7a3a22e726a499ff2831a671a49239104cd34a9937523c \
            inspect infra/k6/vicam-load.js

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  container-security:
    name: Container ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: worker
            dockerfile: infra/docker/worker.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
          - image: backup
            dockerfile: infra/docker/backup.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build immutable candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: vicam/${{ matrix.image }}:candidate-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan container image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: vicam/${{ matrix.image }}:candidate-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  fullstack:
    name: Real Compose full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable pnpm 11.9.0
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @vicam/web exec playwright install --with-deps chromium

      - name: Build Compose candidate
        run: docker compose build api worker web backup

      - name: Start PostgreSQL and ClamAV
        run: docker compose up -d --wait postgres clamav

      - name: Migrate and seed fictitious data
        run: |
          docker compose run --rm api node packages/db/dist/migrate-cli.js
          docker compose run --rm api node packages/db/dist/seed-cli.js

      - name: Start real application stack
        run: docker compose up -d --wait

      - name: Phase 1 through 4 real full-stack
        env:
          VICAM_FULLSTACK_BASE_URL: http://127.0.0.1:8080
          VICAM_FULLSTACK_MANAGER_USERNAME: manager.demo
          VICAM_FULLSTACK_MANAGER_PASSWORD: VicamDev!Manager2026
          VICAM_FULLSTACK_SUPERVISOR_USERNAME: supervisor.ana
          VICAM_FULLSTACK_SUPERVISOR_PASSWORD: VicamDev!SupervisorA2026
        run: pnpm --filter @vicam/web test:e2e:fullstack

      - name: Integrated antivirus rejection
        env:
          VICAM_SMOKE_BASE_URL: http://127.0.0.1:8080
          VICAM_SMOKE_USERNAME: manager.demo
          VICAM_SMOKE_PASSWORD: VicamDev!Manager2026
        run: node infra/scripts/document-antivirus-smoke.mjs

      - name: Database and document restore drill with writers stopped
        env:
          COMPOSE_FILE: compose.yaml
          ENV_FILE: infra/env/local.env.example
        run: |
          docker compose stop api worker
          docker compose restart backup
          docker compose up -d --wait backup
          sh infra/scripts/backup-restore-test.sh
          docker compose up -d --wait api worker caddy

      - name: Collect service logs
        if: always()
        run: docker compose logs --no-color > compose-fullstack.log

      - name: Upload full-stack evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fullstack-evidence
          path: |
            apps/web/playwright-report-fullstack
            apps/web/test-results/fullstack
            compose-fullstack.log

      - name: Stop Compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  publish-ghcr:
    name: Publish GHCR images
    needs: [quality, container-security, fullstack]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: infra/docker/api.Dockerfile
          - image: worker
            dockerfile: infra/docker/worker.Dockerfile
          - image: web
            dockerfile: infra/docker/web.Dockerfile
          - image: backup
            dockerfile: infra/docker/backup.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish SHA-tagged image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/vicam-${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Record deployable immutable reference
        run: |
          echo '### vicam-${{ matrix.image }}' >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository_owner }}/vicam-${{ matrix.image }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
